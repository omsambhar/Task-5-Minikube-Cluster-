apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs
    spec:
      containers:
      - name: nodejs-container
        image: node:14
        command: ["node", "-e", "require('http').createServer((req, res) => res.end('Hello from Node.js')).listen(3000)"]
        ports:
        - containerPort: 3000
